services:
  # Backend API
  - type: web
    name: opsguard-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

  # Frontend App
  - type: web
    name: opsguard-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free